<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกอุณหภูมิเตาเผา</title>
    <style>
        body { font-family: sans-serif; padding: 15px; text-align: center; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #333; }
        .timer-box { font-size: 40px; font-weight: bold; color: #d9534f; margin: 15px 0; }
        input[type="number"] { font-size: 24px; width: 80%; padding: 10px; text-align: center; margin-bottom: 15px; border: 2px solid #ccc; border-radius: 8px; }
        button { font-size: 18px; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-start { background-color: #5cb85c; color: white; width: 100%; margin-bottom: 10px; }
        .btn-send { background-color: #0275d8; color: white; width: 100%; }
        .status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>บันทึกอุณหภูมิเตาเผา</h2>
    <div>เวลาที่ผ่านไป: <span id="elapsed-time" style="font-weight:bold;">0</span> นาที</div>
    
    <div class="timer-box" id="timer">10:00</div>
    
    <input type="number" id="temp-input" placeholder="ใส่ อุณหภูมิ (°C)">
    <br>
    <button class="btn-send" onclick="sendData()">บันทึกข้อมูล (ENTER)</button>
    <br><br>
    <button class="btn-start" id="start-btn" onclick="toggleOven()">▶ เริ่มเดินเตาเผา</button>
    
    <div class="status" id="status-text"></div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    // * นำ URL Google Apps Script ของคุณมาวางในอัญประกาศนี้ *
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbynZ7OBrhSMvTRmI4nxVvLVs1SbUqLiI7uOIRZAo9S3_4AIixvib4Z0bLBOPXF4qVs4Tw/exec"; 

    let timerInterval = null;
    let secondsLeft = 600; // 10 นาที
    let currentMinute = 0;
    let isRunning = false;

    function toggleOven() {
        const btn = document.getElementById('start-btn');
        const status = document.getElementById('status-text');

        if (!isRunning) {
            isRunning = true;
            btn.innerText = "⏹ หยุดเดินเตา";
            btn.style.backgroundColor = "#d9534f";
            status.innerText = "เริ่มบันทึกเวลาเตาเผาแล้ว...";
            status.style.color = "blue";
            
            startTimer();
        } else {
            isRunning = false;
            clearInterval(timerInterval);
            btn.innerText = "▶ เริ่มเดินเตาเผา";
            btn.style.backgroundColor = "#5cb85c";
            status.innerText = "หยุดการทำงานเตาเผา";
            status.style.color = "black";
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        secondsLeft = 600;
        updateTimerDisplay();

        timerInterval = setInterval(function() {
            if (secondsLeft > 0) {
                secondsLeft--;
                updateTimerDisplay();
            } else {
                currentMinute += 10;
                document.getElementById('elapsed-time').innerText = currentMinute;
                
                alert("⏰ ครบ 10 นาทีแล้ว! กรุณากรอกอุณหภูมิ");
                secondsLeft = 600;
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        let m = Math.floor(secondsLeft / 60);
        let s = secondsLeft % 60;
        let mStr = m < 10 ? "0" + m : m;
        let sStr = s < 10 ? "0" + s : s;
        document.getElementById('timer').innerText = mStr + ":" + sStr;
    }

    function sendData() {
        const tempVal = document.getElementById('temp-input').value;
        const status = document.getElementById('status-text');

        if (!tempVal) {
            alert("กรุณากรอกอุณหภูมิก่อนครับ");
            return;
        }

        status.innerText = "กำลังส่งข้อมูล...";
        status.style.color = "orange";

        // ส่งแบบ Form Post เข้า iframe เพื่อหลบปัญหาการบล็อก
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = WEB_APP_URL;
        form.target = 'hidden_iframe';

        const inputData = document.createElement('input');
        inputData.type = 'hidden';
        inputData.name = 'postData';
        inputData.value = JSON.stringify({
            time_minute: currentMinute,
            temperature: tempVal
        });

        form.appendChild(inputData);
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        setTimeout(function() {
            status.innerText = "บันทึก " + tempVal + " °C สำเร็จ!";
            status.style.color = "green";
            document.getElementById('temp-input').value = '';
        }, 1000);
    }

    // กด Enter บน Zebra เพื่อส่งค่า
    document.getElementById('temp-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            sendData();
        }
    });
</script>

</body>
</html>
