<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0275d8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกอุณหภูมิเตาเผา</title>
    <style>
        body { font-family: sans-serif; padding: 15px; text-align: center; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { margin-top: 0; color: #333; }
        .timer-box { font-size: 40px; font-weight: bold; color: #d9534f; margin: 10px 0; }
        input, select { font-size: 18px; width: 85%; padding: 10px; text-align: center; margin-bottom: 12px; border: 2px solid #ccc; border-radius: 8px; background-color: #fff; }
        label { font-size: 14px; color: #555; display: block; text-align: left; margin-left: 7.5%; margin-bottom: 3px; font-weight: bold; }
        button { font-size: 18px; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-start { background-color: #5cb85c; color: white; width: 90%; margin-bottom: 10px; }
        .btn-send { background-color: #0275d8; color: white; width: 90%; }
        .status { margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>บันทึกอุณหภูมิเตาเผา</h2>
    <div>เวลาที่ผ่านไป: <span id="elapsed-time" style="font-weight:bold;">0</span> นาที</div>
    
    <div class="timer-box" id="timer">10:00</div>
    
    <label for="plastic-type">ชนิดพลาสติก:</label>
    <input type="text" id="plastic-type" placeholder="เช่น PP, PE, PET">

    <label for="temp-range">ย่านอุณหภูมิที่ทดสอบ:</label>
    <select id="temp-range">
        <option value="">-- เลือกย่านอุณหภูมิ --</option>
        <option value="200-300">200 - 300 °C</option>
        <option value="300-400">300 - 400 °C</option>
        <option value="400-500">400 - 500 °C</option>
        <option value="500-600">500 - 600 °C</option>
        <option value="600-700">600 - 700 °C</option>
    </select>

    <label for="temp-input">อุณหภูมิปัจจุบัน (°C):</label>
    <input type="number" id="temp-input" placeholder="ใส่ อุณหภูมิ (°C)">
    
    <button class="btn-start" id="start-btn" onclick="toggleOven()">▶ เริ่มเดินเตาเผา</button>
    <br><br>
    <button class="btn-send" id="send-btn" onclick="sendData()" disabled style="opacity: 0.4;">บันทึกข้อมูล (ENTER)</button>
    
    <div class="status" id="status-text">กรอกข้อมูลให้ครบ แล้วกด "เริ่มเดินเตาเผา"</div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    // * นำ URL Google Apps Script ของคุณมาวางตรงนี้ *
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxzjfbvnMbQatpOBtRURtc-Ety6SCBO29-GL4iqb-sxDAvNm1EykMi-bM1U-0GTjLMgcQ/exec"; 

    let timerInterval = null;
    let alarmInterval = null; // ตัวควบคุมเสียงเตือนวนซ้ำ
    let audioCtx = null;
    let secondsLeft = 600; // 10 นาที
    let totalSecondsElapsed = 0;
    let isRunning = false;

    // ระบบเล่นเสียงปี๊บวนซ้ำ (จะดังต่อเนื่องจนกว่าจะสั่งหยุด)
    function startContinuousAlarm() {
        stopContinuousAlarm(); // เคลียร์เสียงเก่าถ้ามี
        
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            // ฟังก์ชันสร้างเสียงปี๊บ 1 ครั้ง
            function playBeep() {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime); // เสียงสูง 900Hz
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4); // ดัง 0.4 วินาที
            }

            // เล่นเสียงครั้งแรกทันที
            playBeep();

            // ให้เสียงปี๊บดังซ้ำทุกๆ 0.8 วินาที (และสั่นวนไป)
            alarmInterval = setInterval(() => {
                playBeep();
                if (navigator.vibrate) navigator.vibrate(300); // สั่น 0.3 วินาที
            }, 800);

        } catch(e) {
            console.log("Audio Alarm Error:", e);
        }
    }

    // ฟังก์ชันหยุดเสียงเตือน
    function stopContinuousAlarm() {
        if (alarmInterval) {
            clearInterval(alarmInterval);
            alarmInterval = null;
        }
    }

    function toggleOven() {
        const plasticInput = document.getElementById('plastic-type');
        const rangeSelect = document.getElementById('temp-range');
        const tempInput = document.getElementById('temp-input');
        const btnStart = document.getElementById('start-btn');
        const btnSend = document.getElementById('send-btn');
        const status = document.getElementById('status-text');

        if (!isRunning) {
            if (!plasticInput.value.trim()) {
                alert("กรุณากรอกชนิดพลาสติกก่อนครับ");
                plasticInput.focus();
                return;
            }
            if (!rangeSelect.value) {
                alert("กรุณาเลือกย่านอุณหภูมิก่อนครับ");
                rangeSelect.focus();
                return;
            }
            if (!tempInput.value) {
                alert("กรุณากรอกอุณหภูมิเริ่มต้นก่อนครับ");
                tempInput.focus();
                return;
            }

            // สร้าง AudioContext ไว้ล่วงหน้าทันทีที่กดปุ่มเริ่มเดินเตา (เพื่อผ่านระบบความปลอดภัยเบราว์เซอร์)
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            isRunning = true;
            btnStart.innerText = "⏹ หยุดเดินเตา";
            btnStart.style.backgroundColor = "#d9534f";
            
            plasticInput.disabled = true;
            rangeSelect.disabled = true;
            
            btnSend.disabled = false;
            btnSend.style.opacity = "1";

            sendData();
            startTimer();
        } else {
            isRunning = false;
            clearInterval(timerInterval);
            stopContinuousAlarm();

            btnStart.innerText = "▶ เริ่มเดินเตาเผา";
            btnStart.style.backgroundColor = "#5cb85c";
            
            plasticInput.disabled = false;
            rangeSelect.disabled = false;
            btnSend.disabled = true;
            btnSend.style.opacity = "0.4";
            
            status.innerText = "หยุดการทำงานเตาเผาแล้ว";
            status.style.color = "black";
        }
    }

    function startTimer() {
        clearInterval(timerInterval);

        timerInterval = setInterval(function() {
            totalSecondsElapsed++;
            
            let currentMinutesElapsed = Math.floor(totalSecondsElapsed / 60);
            document.getElementById('elapsed-time').innerText = currentMinutesElapsed;

            if (secondsLeft > 0) {
                secondsLeft--;
                updateTimerDisplay();
            } else {
                // ครบ 10 นาที ➔ เปิดเสียงเตือนดังต่อเนื่อง
                startContinuousAlarm();
                
                // Alert จะหยุดการทำงานของโค้ดไว้ จนกว่าผู้ใช้จะกด "ตกลง"
                alert("⏰ ครบ 10 นาทีแล้ว! กรุณากรอกอุณหภูมิปัจจุบัน แล้วกดบันทึก");
                
                // พอกด "ตกลง" ปุ๊บ ให้หยุดเสียงเตือนทันที
                stopContinuousAlarm();
                
                secondsLeft = 600; // รีเซ็ตนับถอยหลังรอบใหม่
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        let m = Math.floor(secondsLeft / 60);
        let s = secondsLeft % 60;
        let mStr = m < 10 ? "0" + m : m;
        let sStr = s < 10 ? "0" + s : s;
        document.getElementById('timer').innerText = mStr + ":" + sStr;
    }

    function sendData() {
        const plasticVal = document.getElementById('plastic-type').value.trim();
        const rangeVal = document.getElementById('temp-range').value;
        const tempVal = document.getElementById('temp-input').value;
        const status = document.getElementById('status-text');
        const currentMinutesElapsed = Math.floor(totalSecondsElapsed / 60);

        if (!tempVal) {
            alert("กรุณากรอกอุณหภูมิก่อนบันทึกครับ");
            return;
        }

        // หากยังมีเสียงเตือนค้างอยู่ ให้ปิดเสียงเมื่อกดบันทึก
        stopContinuousAlarm();

        status.innerText = "กำลังส่งข้อมูล...";
        status.style.color = "orange";

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = WEB_APP_URL;
        form.target = 'hidden_iframe';

        const inputData = document.createElement('input');
        inputData.type = 'hidden';
        inputData.name = 'postData';
        inputData.value = JSON.stringify({
            plastic_type: plasticVal,
            temp_range: rangeVal,
            time_minute: currentMinutesElapsed,
            temperature: tempVal
        });

        form.appendChild(inputData);
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        setTimeout(function() {
            status.innerText = "บันทึก [" + plasticVal + " | ย่าน " + rangeVal + "] " + tempVal + " °C สำเร็จ!";
            status.style.color = "green";
            document.getElementById('temp-input').value = '';
        }, 1000);
    }

    document.getElementById('temp-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            sendData();
        }
    });
</script>

</body>
</html>
