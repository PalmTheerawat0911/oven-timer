<!DOCTYPE html>
<html lang="th">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0275d8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกอุณหภูมิเตาเผา</title>
    <style>
        body { font-family: sans-serif; padding: 15px; text-align: center; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { margin-top: 0; color: #333; }
        .timer-box { font-size: 40px; font-weight: bold; color: #d9534f; margin: 10px 0; }
        input, select { font-size: 18px; width: 85%; padding: 10px; text-align: center; margin-bottom: 12px; border: 2px solid #ccc; border-radius: 8px; background-color: #fff; }
        label { font-size: 14px; color: #555; display: block; text-align: left; margin-left: 7.5%; margin-bottom: 3px; font-weight: bold; }
        button { font-size: 18px; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-start { background-color: #5cb85c; color: white; width: 90%; margin-bottom: 10px; }
        .btn-send { background-color: #0275d8; color: white; width: 90%; }
        .status { margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>บันทึกอุณหภูมิเตาเผา</h2>
    <div>เวลาที่ผ่านไป: <span id="elapsed-time" style="font-weight:bold;">0</span> นาที</div>
    
    <div class="timer-box" id="timer">10:00</div>
    
    <label for="plastic-type">ชนิดพลาสติก:</label>
    <input type="text" id="plastic-type" placeholder="เช่น PP, PE, PET">

    <label for="temp-range">ย่านอุณหภูมิที่ทดสอบ:</label>
    <select id="temp-range">
        <option value="">-- เลือกย่านอุณหภูมิ --</option>
        <option value="200-300">200 - 300 °C</option>
        <option value="300-400">300 - 400 °C</option>
        <option value="400-500">400 - 500 °C</option>
        <option value="500-600">500 - 600 °C</option>
        <option value="600-700">600 - 700 °C</option>
    </select>

    <label for="temp-input">อุณหภูมิปัจจุบัน (°C):</label>
    <input type="number" id="temp-input" placeholder="ใส่ อุณหภูมิ (°C)">
    
    <button class="btn-start" id="start-btn" onclick="toggleOven()">▶ เริ่มเดินเตาเผา</button>
    <br><br>
    <button class="btn-send" id="send-btn" onclick="sendData()" disabled style="opacity: 0.4;">บันทึกข้อมูล (ENTER)</button>
    
    <div class="status" id="status-text">กรอกข้อมูลให้ครบ แล้วกด "เริ่มเดินเตาเผา"</div>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

<script>
    // * นำ URL Google Apps Script ของคุณมาวางตรงนี้ *
    const WEB_APP_URL = "วาง_WEB_APP_URL_ของคุณที่นี่"; 

    let timerInterval = null;
    let alarmInterval = null;
    let audioCtx = null;
    let isRunning = false;

    // ตรวจสอบสถานะเดิมเมื่อโหลดหน้าเว็บใหม่
    window.addEventListener('load', () => {
        checkAndRestoreState();
    });

    function playBeep() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(900, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } catch(e) {}
    }

    function startContinuousAlarm() {
        stopContinuousAlarm();
        playBeep();
        alarmInterval = setInterval(() => {
            playBeep();
            if (navigator.vibrate) navigator.vibrate(300);
        }, 800);
    }

    function stopContinuousAlarm() {
        if (alarmInterval) {
            clearInterval(alarmInterval);
            alarmInterval = null;
        }
    }

    function toggleOven() {
        const plasticInput = document.getElementById('plastic-type');
        const rangeSelect = document.getElementById('temp-range');
        const tempInput = document.getElementById('temp-input');
        const btnStart = document.getElementById('start-btn');

        if (!isRunning) {
            if (!plasticInput.value.trim()) { alert("กรุณากรอกชนิดพลาสติกก่อนครับ"); plasticInput.focus(); return; }
            if (!rangeSelect.value) { alert("กรุณาเลือกย่านอุณหภูมิก่อนครับ"); rangeSelect.focus(); return; }
            if (!tempInput.value) { alert("กรุณากรอกอุณหภูมิเริ่มต้นก่อนครับ"); tempInput.focus(); return; }

            // เซฟเวลาเริ่มเดินเตา (Timestamp) และข้อมูลเข้าความจำเครื่อง
            const startTime = Date.now();
            localStorage.setItem('oven_start_time', startTime);
            localStorage.setItem('plastic_type', plasticInput.value.trim());
            localStorage.setItem('temp_range', rangeSelect.value);
            localStorage.setItem('is_running', 'true');

            // บันทึกค่านาทีที่ 0 ทันที
            sendData();
            
            restoreUIState();
            runTimerLoop();
        } else {
            // กดหยุดเตาเผา ➔ ลบข้อมูลจำออก
            clearOvenState();
        }
    }

    function checkAndRestoreState() {
        const storedIsRunning = localStorage.getItem('is_running');
        if (storedIsRunning === 'true') {
            document.getElementById('plastic-type').value = localStorage.getItem('plastic_type') || '';
            document.getElementById('temp-range').value = localStorage.getItem('temp_range') || '';
            restoreUIState();
            runTimerLoop();
        }
    }

    function restoreUIState() {
        isRunning = true;
        const btnStart = document.getElementById('start-btn');
        const btnSend = document.getElementById('send-btn');
        
        btnStart.innerText = "⏹ หยุดเดินเตา";
        btnStart.style.backgroundColor = "#d9534f";
        
        document.getElementById('plastic-type').disabled = true;
        document.getElementById('temp-range').disabled = true;
        
        btnSend.disabled = false;
        btnSend.style.opacity = "1";
    }

    function runTimerLoop() {
        if (timerInterval) clearInterval(timerInterval);

        timerInterval = setInterval(() => {
            const startTime = parseInt(localStorage.getItem('oven_start_time') || Date.now());
            const now = Date.now();
            const totalSecondsElapsed = Math.floor((now - startTime) / 1000);

            // อัปเดตเวลาที่ผ่านไป (นาที)
            const minutesElapsed = Math.floor(totalSecondsElapsed / 60);
            document.getElementById('elapsed-time').innerText = minutesElapsed;

            // คำนวณเวลานับถอยหลังรอบละ 10 นาที (600 วินาที)
            const secondsInCurrentCycle = totalSecondsElapsed % 600;
            const secondsLeft = 600 - secondsInCurrentCycle;

            updateTimerDisplay(secondsLeft);

            // หากวนมาชนรอบ 10 นาทีพอดี (เหลือ 600 เท่ากับเริ่มรอบใหม่)
            if (secondsInCurrentCycle === 0 && totalSecondsElapsed > 0) {
                startContinuousAlarm();
                alert("⏰ ครบ 10 นาทีแล้ว! กรุณากรอกอุณหภูมิปัจจุบันแล้วกดบันทึก");
                stopContinuousAlarm();
            }
        }, 1000);
    }

    function updateTimerDisplay(sec) {
        let m = Math.floor(sec / 60);
        let s = sec % 60;
        let mStr = m < 10 ? "0" + m : m;
        let sStr = s < 10 ? "0" + s : s;
        document.getElementById('timer').innerText = mStr + ":" + sStr;
    }

    function clearOvenState() {
        isRunning = false;
        clearInterval(timerInterval);
        stopContinuousAlarm();

        localStorage.removeItem('oven_start_time');
        localStorage.removeItem('plastic_type');
        localStorage.removeItem('temp_range');
        localStorage.removeItem('is_running');

        const btnStart = document.getElementById('start-btn');
        const btnSend = document.getElementById('send-btn');
        const status = document.getElementById('status-text');

        btnStart.innerText = "▶ เริ่มเดินเตาเผา";
        btnStart.style.backgroundColor = "#5cb85c";
        
        document.getElementById('plastic-type').disabled = false;
        document.getElementById('temp-range').disabled = false;
        btnSend.disabled = true;
        btnSend.style.opacity = "0.4";
        
        document.getElementById('timer').innerText = "10:00";
        document.getElementById('elapsed-time').innerText = "0";
        status.innerText = "หยุดการทำงานเตาเผาเรียบร้อยแล้ว";
        status.style.color = "black";
    }

    function sendData() {
        const plasticVal = document.getElementById('plastic-type').value.trim();
        const rangeVal = document.getElementById('temp-range').value;
        const tempVal = document.getElementById('temp-input').value;
        const status = document.getElementById('status-text');

        const startTime = parseInt(localStorage.getItem('oven_start_time') || Date.now());
        const totalSecondsElapsed = Math.floor((Date.now() - startTime) / 1000);
        const currentMinutesElapsed = Math.floor(totalSecondsElapsed / 60);

        if (!tempVal) {
            alert("กรุณากรอกอุณหภูมิก่อนบันทึกครับ");
            return;
        }

        stopContinuousAlarm();
        status.innerText = "กำลังส่งข้อมูล...";
        status.style.color = "orange";

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = WEB_APP_URL;
        form.target = 'hidden_iframe';

        const inputData = document.createElement('input');
        inputData.type = 'hidden';
        inputData.name = 'postData';
        inputData.value = JSON.stringify({
            plastic_type: plasticVal,
            temp_range: rangeVal,
            time_minute: currentMinutesElapsed,
            temperature: tempVal
        });

        form.appendChild(inputData);
        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        setTimeout(function() {
            status.innerText = "บันทึก [" + plasticVal + " | ย่าน " + rangeVal + "] " + tempVal + " °C สำเร็จ!";
            status.style.color = "green";
            document.getElementById('temp-input').value = '';
        }, 1000);
    }

    document.getElementById('temp-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            sendData();
        }
    });
</script>

</body>
</html>
